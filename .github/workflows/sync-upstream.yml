# GitHub only runs scheduled workflows that exist on the default branch. Keep
# this file on custom-dashboard and stage upstream commits on a dedicated
# automation branch; the protected main branch is deliberately not rewritten.
name: Sync Sure Upstream

on:
  schedule:
    # Avoid the beginning of the hour, when scheduled Actions runs are busiest.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-sure-upstream
  cancel-in-progress: false

env:
  MIRROR_BRANCH: upstream-sync
  CUSTOM_BRANCH: custom-dashboard

jobs:
  sync:
    name: Sync upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate automation token
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::The AUTOMATION_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Checkout custom branch
        uses: actions/checkout@v6
        with:
          ref: custom-dashboard
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Fetch Sure upstream
        run: |
          git remote add upstream https://github.com/we-promise/sure.git
          git fetch --no-tags upstream main

      - name: Update upstream staging branch
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(git rev-parse upstream/main)"
          mirror_sha="$(git ls-remote --heads origin refs/heads/$MIRROR_BRANCH | awk '{print $1}')"

          if [[ "$mirror_sha" == "$upstream_sha" ]]; then
            echo "$MIRROR_BRANCH already matches upstream/main."
            exit 0
          fi

          # This branch is owned exclusively by the automation. A lease still
          # prevents overwriting a concurrent workflow or an unexpected edit.
          git push origin \
            upstream/main:refs/heads/$MIRROR_BRANCH \
            --force-with-lease=refs/heads/$MIRROR_BRANCH:"$mirror_sha"

          test "$(git ls-remote --heads origin refs/heads/$MIRROR_BRANCH | awk '{print $1}')" = "$upstream_sha"

  create-pr:
    name: Create update PR
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate automation token
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::The AUTOMATION_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Checkout custom branch
        uses: actions/checkout@v6
        with:
          ref: custom-dashboard
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}
          persist-credentials: false

      - name: Check for upstream commits to integrate
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            +refs/heads/$MIRROR_BRANCH:refs/remotes/origin/$MIRROR_BRANCH \
            +refs/heads/custom-dashboard:refs/remotes/origin/custom-dashboard

          if git merge-base --is-ancestor origin/$MIRROR_BRANCH origin/custom-dashboard; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "custom-dashboard already contains every upstream commit."
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Upstream contains commits not yet integrated into custom-dashboard."
          fi

      - name: Create or reuse update PR
        if: steps.diff.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(gh pr list \
            --repo "$GH_REPO" \
            --base "$CUSTOM_BRANCH" \
            --head "$MIRROR_BRANCH" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number')"

          if [[ -n "$pr_number" ]]; then
            echo "Using existing PR #$pr_number"
            exit 0
          fi

          gh pr create \
            --repo "$GH_REPO" \
            --base "$CUSTOM_BRANCH" \
            --head "$MIRROR_BRANCH" \
            --title "Sync latest Sure upstream changes" \
            --body "Automatic proposal to integrate the latest we-promise/sure:main commits into custom-dashboard. Merge this PR with a merge commit (not squash or rebase) so future sync runs can recognize the upstream commits as integrated."
